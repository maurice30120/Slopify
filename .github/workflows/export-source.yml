name: Export source

on:
  pull_request:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: slopify-dependencies
          path: node_modules
          include-hidden-files: true
