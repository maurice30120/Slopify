name: Export source

on:
  pull_request:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: slopify-source
          path: |
            .
            !.git
          include-hidden-files: true
