name: Issue 6 TypeScript diagnostics

on:
  push:
    branches:
      - agent/issue-6-deterministic-multi-agent-checkpoints
  pull_request:
    branches:
      - feature/migrate-sandcastle-to-docker-sandbox

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture build and test diagnostics
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          build_exit="$?"
          echo "$build_exit" > build.exit
          if [ "$build_exit" = "0" ]; then
            npm test > test.log 2>&1
            echo "$?" > test.exit
          else
            echo "Tests skipped because build failed." > test.log
            echo "1" > test.exit
          fi
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-6-diagnostics
          path: |
            build.log
            build.exit
            test.log
            test.exit
      - name: Fail when build or tests failed
        run: |
          test "$(cat build.exit)" = "0"
          test "$(cat test.exit)" = "0"
