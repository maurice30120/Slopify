name: Issue 6 TypeScript diagnostics

on:
  push:
    branches:
      - agent/issue-6-deterministic-multi-agent-checkpoints

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture build diagnostics
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          echo "$?" > build.exit
          exit 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-6-build-diagnostics
          path: |
            build.log
            build.exit
      - name: Fail when build failed
        run: test "$(cat build.exit)" = "0"
